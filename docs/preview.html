<style>
:root{--bg:#0a0a0a;--fg:#f1f0ec;--muted:rgba(241,240,236,.62);--faint:rgba(241,240,236,.38);--line:rgba(241,240,236,.1);--card:rgba(18,18,18,.58);--card-hi:rgba(28,28,28,.72);--btn-bg:#f1f0ec;--btn-fg:#0a0a0a;--ok:#3ddc84;--warn:#e8b14f;--bad:#ef6b62;--ease:cubic-bezier(.22,1,.36,1);--font:'IBM Plex Sans Arabic',system-ui,sans-serif;color-scheme:dark}

let hash=2166136261;for(const c of JSON.stringify(P)){hash^=c.charCodeAt(0);hash=Math.imul(hash,16777619)}const storageKey='mokhtabar:v3:'+P.id+':'+(hash>>>0).toString(16);let storageOK=true;
function save(){state.questionId=Q[state.step]?.id||null;try{localStorage.setItem(storageKey,JSON.stringify(state));$('save-state').dataset.s='saved';$('save-text').textContent='محفوظ محليًا'}catch{$('save-state').dataset.s='error';$('save-text').textContent='الحفظ غير متاح';storageOK=false}}
function applySelection(s){if(s?.projectId!==P.id)return;for(const q of allQ){if(q.options.some(o=>o.id===s.choices?.[q.id]))state.choices[q.id]=s.choices[q.id];if(typeof s.ideas?.[q.id]==='string')state.ideas[q.id]=s.ideas[q.id];for(const o of q.options){const key=q.id+'/'+o.id;if(typeof s.notes?.[key]==='string')state.notes[key]=s.notes[key]}}if(s.pageNotes&&typeof s.pageNotes==='object')for(const page of P.screens){if(typeof s.pageNotes[page.id]==='string')state.pageNotes[page.id]=s.pageNotes[page.id]}if(s.canvasPositions&&typeof s.canvasPositions==='object')for(const page of P.screens){const v=s.canvasPositions[page.id];if(v&&Number.isFinite(v.x)&&Number.isFinite(v.y)&&v.x>=0&&v.y>=0&&v.x<=20000&&v.y<=20000)state.canvasPositions[page.id]={x:v.x,y:v.y}}if(s.canvasView&&Number.isFinite(s.canvasView.x)&&Number.isFinite(s.canvasView.y)&&Number.isFinite(s.canvasView.zoom))state.canvasView={x:s.canvasView.x,y:s.canvasView.y,zoom:Math.max(.15,Math.min(2,s.canvasView.zoom))};if(typeof s.general==='string')state.general=s.general}

function visibleQuestions(override){const visible=new Set(),choices={...state.choices,...(override?{[override.qid]:override.option.id}:{})};return allQ.filter(q=>{const ok=Object.entries(q.when||{}).every(([id,values])=>visible.has(id)&&values.includes(choices[id]));if(ok)visible.add(q.id);return ok})}

function screenHTML(sid,override){const screen=P.screens.find(s=>s.id===sid),doc=new DOMParser().parseFromString(screen.html,'text/html'),active=new Set(visibleQuestions(override).map(q=>q.id));for(const q of allQ){const o=override?.qid===q.id?override.option:selected(q),patches=o.patches[sid]||{};for(const [slot,html]of Object.entries(patches)){const node=Array.from(doc.querySelectorAll('[data-slot]')).find(el=>el.dataset.slot===slot);if(node){node.hidden=!active.has(q.id);if(active.has(q.id))node.innerHTML=html}}}const choices={...state.choices,...(override?{[override.qid]:override.option.id}:{})},matches=when=>Object.entries(when||{}).every(([id,values])=>active.has(id)&&values.includes(choices[id])),pages=new Set(P.screens.filter(p=>matches(p.when)).map(p=>p.id));for(const link of doc.querySelectorAll('[data-nav],a[href^="#page-"]')){const target=link.dataset.nav||link.getAttribute('href').slice(6);if(target===sid){link.setAttribute('aria-current','page');if(link.tagName==='BUTTON')link.disabled=true}else if(P.flow&&(!pages.has(target)||!P.flow.edges.some(e=>e.from===sid&&e.to===target&&matches(e.when))))link.hidden=true}return doc.body.innerHTML}

let graphPositions={};
function graphTransform(){const v=state.canvasView;$('flow-world').style.transform=`translate(${v.x}px,${v.y}px) scale(${v.zoom})`;$('flow-zoom').textContent=Math.round(v.zoom*100)+'%'}
function edgePath(edge){const a=graphPositions[edge.from],b=graphPositions[edge.to];if(!a||!b)return null;const m=nodeMetrics(),mid=a.y+m.height/2;if(edge.from===edge.to)return {d:`M ${a.x+m.width} ${mid} C ${a.x+m.width+90} ${a.y-70}, ${a.x-90} ${a.y-70}, ${a.x} ${mid}`,x:a.x+m.width/2,y:a.y-12};if(Math.abs(a.x-b.x)<30){const x1=a.x+m.width,x2=b.x+m.width,y1=mid,y2=b.y+m.height/2,out=Math.max(x1,x2)+100;return {d:`M ${x1} ${y1} C ${out} ${y1}, ${out} ${y2}, ${x2} ${y2}`,x:out-10,y:(y1+y2)/2}}const forward=b.x>a.x,x1=forward?a.x+m.width:a.x,x2=forward?b.x:b.x+m.width,y1=a.y+m.height*(forward?.45:.68),y2=b.y+m.height*(forward?.45:.68),dx=Math.max(60,Math.abs(x2-x1)*.5),sign=forward?1:-1;return {d:`M ${x1} ${y1} C ${x1+sign*dx} ${y1}, ${x2-sign*dx} ${y2}, ${x2} ${y2}`,x:(x1+x2)/2,y:(y1+y2)/2-10}}
function renderEdges(){const edges=activeEdges();$('flow-edges').innerHTML='<defs><marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#b5b5b1"/></marker></defs>'+edges.map(e=>{const p=edgePath(e);return p?`<g data-edge="${e.id}"><path d="${p.d}" marker-end="url(#flow-arrow)"/><text x="${p.x}" y="${p.y}" text-anchor="middle">${esc(e.trigger)}</text></g>`:''}).join('')}
function renderFlow(){const screens=visibleScreens(),metrics=nodeMetrics();$('flow-format').value=state.device;if(!screens.some(s=>s.id===graphSelected))graphSelected=screens[0]?.id;graphPositions=defaultPositions();$('flow-nodes').innerHTML=screens.map(s=>{const pos=graphPositions[s.id];return `<button type="button" class="flow-node" data-page="${s.id}" aria-pressed="${s.id===graphSelected}" style="left:${pos.x}px;top:${pos.y}px;width:${metrics.width}px;height:${metrics.height}px"><span class="node-title">${esc(s.title)}${s.id===P.flow?.entry?'<small>البداية</small>':''}</span><span class="node-preview" style="width:${metrics.previewWidth}px;height:${metrics.previewHeight}px"><iframe sandbox tabindex="-1" aria-hidden="true" title="${esc(s.title)}" data-thumb-page="${s.id}"></iframe></span><small class="node-route">${esc(s.route||'')}</small></button>`}).join('');const view=views.find(v=>v.id===state.device)||views[0];for(const frame of $('flow-nodes').querySelectorAll('iframe')){frame.style.width=view.width+'px';frame.style.height=view.height+'px';frame.style.transform=`scale(${metrics.previewWidth/view.width})`;frame.srcdoc=wrap(screenHTML(frame.dataset.thumbPage),siteCSS(),P.screens.find(s=>s.id===frame.dataset.thumbPage).title,true,false)}renderEdges();graphTransform();renderGraphDetails()}
function pageSpecs(s){return `<p class="route">${esc(s.route||'')}</p>${s.purpose?`<p>${esc(s.purpose)}</p>`:''}${s.sections?.length?'<h4>الأقسام</h4><ul>'+s.sections.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}${s.actions?.length?'<h4>الإجراءات</h4><ul>'+s.actions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}${pageChoices(s.id).length?'<details class="decision-details"><summary>اختيارات الصفحة</summary>'+pageChoices(s.id).map(q=>'<p>'+esc(q.title)+' '+esc(selected(q).title)+'</p>').join('')+'</details>':''}${P.source?.fidelity==='reconstructed'?'<small>معاينة معاد بناؤها من المرجع.</small>':''}`}
function renderGraphDetails(){const s=P.screens.find(s=>s.id===graphSelected);if(!s)return;$('flow-details').innerHTML=`<h3>${esc(s.title)}</h3>${pageSpecs(s)}<button type="button" id="flow-open-page" class="btn">فتح الصفحة</button><label for="flow-page-note">ملاحظة للوكيل</label><textarea id="flow-page-note" placeholder="ملاحظتك على الصفحة">${esc(state.pageNotes[s.id]||'')}</textarea>`;$('flow-page-note').addEventListener('input',e=>{state.pageNotes[s.id]=e.target.value;state.done=false;save()});$('flow-open-page').addEventListener('click',()=>openPage(s.id))}
function selectGraph(id){graphSelected=id;for(const node of $('flow-nodes').querySelectorAll('button'))node.setAttribute('aria-pressed',node.dataset.page===id);renderGraphDetails()}
function renderPageDetail(){const s=P.screens.find(s=>s.id===pageDetailId);if(!s)return;$('page-heading').textContent=s.title;$('page-specs').innerHTML=pageSpecs(s);$('page-note').value=state.pageNotes[s.id]||'';const view=views.find(v=>v.id===state.device)||views[0];$('page-format').value=state.device;$('page-size').innerHTML=esc(view.title)+' · <span class="dimensions">'+view.width+' × '+view.height+'</span>';$('page-live-frame').srcdoc=wrap(screenHTML(s.id),siteCSS(),s.title);fitPageDetail()}
function fitPageDetail(){const view=views.find(v=>v.id===state.device)||views[0],box=$('page-preview'),frame=$('page-live-frame'),scale=Math.min(Math.max(1,box.clientWidth-24)/view.width,Math.max(1,box.clientHeight-24)/view.height);frame.style.width=view.width+'px';frame.style.height=view.height+'px';frame.style.transform=`translateX(-50%) scale(${scale})`}
function openPage(id){if(!visibleScreens().some(s=>s.id===id))return;pageDetailId=id;if(!$('page-dialog').open)$('page-dialog').showModal();renderPageDetail()}
$('page-note').addEventListener('input',e=>{state.pageNotes[pageDetailId]=e.target.value;state.done=false;save()});$('page-use').addEventListener('click',()=>{state.screen=pageDetailId;$('page-dialog').close();if($('flow-dialog').open)$('flow-dialog').close();renderPreview();save()});$('page-replay').addEventListener('click',()=>$('page-live-frame').contentWindow.postMessage({type:'mokhtabar:play'},'*'));$('page-format').innerHTML=views.map(v=>`<option value="${v.id}">${esc(v.title)}</option>`).join('');$('page-format').addEventListener('change',e=>{state.device=e.target.value;renderPageDetail();fit();renderQuestion();save()});new ResizeObserver(fitPageDetail).observe($('page-preview'));
$('flow-format').innerHTML=views.map(v=>`<option value="${v.id}">${esc(v.title)}</option>`).join('');$('flow-format').addEventListener('change',e=>{state.device=e.target.value;renderFlow();$('flow-fit').click();renderQuestion();fit();save()});
$('flow-open').addEventListener('click',()=>{graphSelected=state.screen;$('flow-dialog').showModal();renderFlow()});$('page-open').addEventListener('click',()=>openPage(state.screen));document.querySelectorAll('[data-close-dialog]').forEach(b=>b.addEventListener('click',()=>$(b.dataset.closeDialog).close()));
function graphZoom(factor,cx,cy){const area=$('flow-area').getBoundingClientRect(),v=state.canvasView,x=cx??area.width/2,y=cy??area.height/2,next=Math.max(.15,Math.min(2,v.zoom*factor));v.x=x-(x-v.x)*next/v.zoom;v.y=y-(y-v.y)*next/v.zoom;v.zoom=next;graphTransform();save()}
$('flow-in').addEventListener('click',()=>graphZoom(1.2));$('flow-out').addEventListener('click',()=>graphZoom(1/1.2));$('flow-fit').addEventListener('click',()=>{const pos=Object.values(graphPositions),metrics=nodeMetrics();if(!pos.length)return;const minX=Math.min(...pos.map(p=>p.x)),minY=Math.min(...pos.map(p=>p.y)),maxX=Math.max(...pos.map(p=>p.x+metrics.width)),maxY=Math.max(...pos.map(p=>p.y+metrics.height)),box=$('flow-area'),z=Math.max(.15,Math.min(1.2,(box.clientWidth-64)/(maxX-minX),(box.clientHeight-64)/(maxY-minY)));state.canvasView={x:32-minX*z,y:32-minY*z,zoom:z};graphTransform();save()});$('flow-area').addEventListener('wheel',e=>{e.preventDefault();const r=$('flow-area').getBoundingClientRect();graphZoom(e.deltaY<0?1.08:1/1.08,e.clientX-r.left,e.clientY-r.top)},{passive:false});
let drag=null;$('flow-area').addEventListener('pointerdown',e=>{if(e.button!==0)return;const node=e.target.closest('.flow-node');graphDragged=false;drag={pointer:e.pointerId,startX:e.clientX,startY:e.clientY,node:node?.dataset.page,x:node?graphPositions[node.dataset.page].x:state.canvasView.x,y:node?graphPositions[node.dataset.page].y:state.canvasView.y};$('flow-area').setPointerCapture(e.pointerId)});$('flow-area').addEventListener('pointermove',e=>{if(!drag||drag.pointer!==e.pointerId)return;const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;if(Math.abs(dx)+Math.abs(dy)<4&&!graphDragged)return;graphDragged=true;if(drag.node){const z=state.canvasView.zoom,pos={x:Math.max(0,Math.min(20000,drag.x+dx/z)),y:Math.max(0,Math.min(20000,drag.y+dy/z))};graphPositions[drag.node]=pos;state.canvasPositions[drag.node]=pos;const node=$('flow-nodes').querySelector(`[data-page="${drag.node}"]`);node.style.left=pos.x+'px';node.style.top=pos.y+'px';renderEdges()}else{state.canvasView.x=drag.x+dx;state.canvasView.y=drag.y+dy;graphTransform()}});function endDrag(){if(drag){if(drag.node&&!graphDragged)selectGraph(drag.node);drag=null;save()}}$('flow-area').addEventListener('pointerup',endDrag);$('flow-area').addEventListener('pointercancel',endDrag);$('flow-nodes').addEventListener('click',e=>{const node=e.target.closest('.flow-node');if(node&&!graphDragged)selectGraph(node.dataset.page);graphDragged=false});$('flow-nodes').addEventListener('dblclick',e=>{const node=e.target.closest('.flow-node');if(node)openPage(node.dataset.page)});$('flow-nodes').addEventListener('keydown',e=>{const node=e.target.closest('.flow-node');if(!node)return;if(e.key==='Enter'){e.preventDefault();selectGraph(node.dataset.page)}else if(e.key===' '){e.preventDefault();openPage(node.dataset.page)}});
window.addEventListener('message',e=>{if(e.data?.type!=='mokhtabar:navigate')return;const from=e.source===$('site-frame').contentWindow?state.screen:e.source===$('page-live-frame').contentWindow&&$('page-dialog').open?pageDetailId:null;if(!from||typeof e.data.target!=='string'||!activeEdges().some(edge=>edge.from===from&&edge.to===e.data.target))return;if(e.source===$('page-live-frame').contentWindow){pageDetailId=e.data.target;$('page-format').value=state.device;renderPageDetail()}else{state.screen=e.data.target;renderPreview();save()}});

$('project-title').textContent=P.title;document.title='مختبر / '+P.title;$('screen').innerHTML=visibleScreens().map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('');applySelection(P.initialSelection);restore();refresh();if(state.step<Q.length)state.screen=Q[state.step].screen;renderQuestion();renderPreview();new ResizeObserver(()=>{fit();fitChoiceThumbs()}).observe($('viewport'));if(state.done)showResult();else if(storageOK)save();
})();
</script>
</body>
