<style>
:root{--bg:#0a0a0a;--fg:#f1f0ec;--muted:rgba(241,240,236,.62);--faint:rgba(241,240,236,.38);--line:rgba(241,240,236,.1);--card:rgba(18,18,18,.58);--card-hi:rgba(28,28,28,.72);--btn-bg:#f1f0ec;--btn-fg:#0a0a0a;--ok:#3ddc84;--warn:#e8b14f;--bad:#ef6b62;--ease:cubic-bezier(.22,1,.36,1);--font:'IBM Plex Sans Arabic',system-ui,sans-serif;color-scheme:dark}

<body>
<div class="page">
<header><div class="head"><h1>مختبر <span aria-hidden="true">/</span> <span id="project-title"></span></h1><span class="save-state" id="save-state"><i></i><span id="save-text">حفظ محلي</span></span></div></header>
<main id="work" class="work">

<div class="viewport" id="viewport"><div class="device" id="device"><iframe id="site-frame" title="المشروع بالاختيارات الحالية" sandbox="allow-scripts"></iframe></div></div>
<p class="caption" id="device-caption">عرض حقيقي للجوال · 390 × 780</p>
<div class="component-box"><div class="component-head"><h3 id="component-title">الخيار لحاله</h3><button id="component-replay" class="small-button" type="button">تشغيل ↻</button></div><iframe id="component-frame" title="معاينة الخيار منفردًا" sandbox="allow-scripts"></iframe></div><details id="work-plan" class="work-plan"></details>
</section>
<section class="panel" aria-label="اختيارات التصميم"><div class="phase-bar"><label for="phase-select">المرحلة</label><select id="phase-select"></select></div><p class="note" id="phase-help"></p><div class="dots" id="dots" aria-label="خطوات الاختيار"></div><div id="question" class="panel"></div><div class="nav"><button class="btn btn--ghost" id="prev" type="button">السابق</button><button class="btn" id="next" type="button">التالي</button></div><p class="note">Enter: التالي</p></section>
</main>
<section class="result" id="result" hidden aria-labelledby="result-title"><div class="result-top"><div><h2 id="result-title">النص النهائي</h2></div><button id="copy" class="btn" type="button">نسخ النص ⧉</button></div><pre id="output" tabindex="0" aria-label="النص النهائي القابل للنسخ"></pre><div class="result-actions"><button id="edit" class="small-button" type="button">العودة للتعديل</button><button id="json-download" class="small-button" type="button">تنزيل الاختيارات JSON</button><button id="site-download" class="small-button" type="button">تنزيل لوحة العمل HTML</button><button id="text-download" class="small-button" type="button">تنزيل النص</button></div></section>

</div>

<script type="application/json" id="project-data">__PROJECT_JSON__</script>
<script>
(()=>{'use strict';
const P=JSON.parse(document.getElementById('project-data').textContent),allQ=P.questions,$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function phaseOf(q){return phases.find(p=>p.id===q?.phase)||phases[0]}
function refresh(prefer){const visible=new Set();Q=allQ.filter(q=>{const ok=Object.entries(q.when||{}).every(([id,values])=>visible.has(id)&&values.includes(state.choices[id]));if(ok)visible.add(q.id);return ok});const index=Q.findIndex(q=>q.id===(prefer||state.questionId));state.step=index>=0?index:Math.max(0,Math.min(state.step,Q.length));state.questionId=Q[state.step]?.id||null}
let hash=2166136261;for(const c of JSON.stringify(P)){hash^=c.charCodeAt(0);hash=Math.imul(hash,16777619)}const storageKey='mokhtabar:v3:'+P.id+':'+(hash>>>0).toString(16);let storageOK=true;

function exportText(){const decisions=Q.map((q,i)=>{const o=selected(q);return `${i+1}. [${phaseOf(q).title}] ${q.title}\nأثر القرار: ${q.impact||q.hint}\nالاختيار: ${o.title}\nالفكرة: ${o.concept}\nالتفاصيل: ${o.description}\nالمكسب والتضحية: ${o.tradeoff}\nالتنفيذ: ${o.implementation}\nتعليل الاقتراح الأصلي: ${q.recommendation||'حسب هدف المشروع'}\nملاحظتي: ${state.notes[q.id+'/'+o.id]||'لا توجد'}\nفكرة خاصة أو تركيب أريده: ${state.ideas[q.id]||'لا توجد'}\nمعرّف القرار: ${q.id}/${o.id}`}).join('\n\n');const active=new Set(Q.map(q=>q.id)),otherNotes=allQ.flatMap(q=>q.options.filter(o=>(!active.has(q.id)||o.id!==state.choices[q.id])&&state.notes[q.id+'/'+o.id]).map(o=>`${q.title} / ${o.title} (${active.has(q.id)?'بديل غير مختار':'سؤال خارج المسار الحالي'}): ${state.notes[q.id+'/'+o.id]}`));const tasks=activeTasks().map(w=>`- ${w.id}: ${w.title}\n  المرحلة: ${phases.find(p=>p.id===w.phase)?.title||w.phase}\n  العمل: ${w.description}\n  يعتمد على: ${w.dependsOn.join('، ')||'لا شيء'}\n  القبول: ${w.acceptance}`).join('\n');const guidance={interface:'نفّذ الواجهات والوظائف المختارة مع ربط الخدمات اللازمة وخطة التنفيذ.',motion:'حوّل القرارات إلى storyboard ومواصفات موشن وتوقيت وكاميرا وانتقالات وملفات إنتاج. HTML يوضح الحركة ولا يصدّر فيديو.',video:'اكتب قائمة اللقطات والمشاهد والنص والإيقاع والزوايا والانتقالات والصوت وخطة الإنتاج. المعاينة توضيحية ولا تنتج MP4.',planning:'حوّل القرارات إلى خطة تنفيذ بمراحل وتبعيات ومخرجات ومعايير قبول وافتراضات ومخاطر وخطوات تالية.',explanation:'أنشئ شرحًا وفق البنية المختارة، مع أمثلة ومفاهيم وعلاقات وتحقيق فهم وخطوات تطبيق.',mixed:'ادمج القرارات في مخرجات وخطة عمل وفق المجال المذكور، وميّز بين المعاينة والتنفيذ الفعلي.'}[P.domain||'interface'];
return `# مواصفات العمل — ${P.title}\n\n${guidance}\nاحترم القرارات والملاحظات والأفكار الخاصة. إذا تطلبت الفكرة الخاصة تعديل البديل، ناقش التعارض الحقيقي وحده؛ لا تعد إلى الافتراضات تلقائيًا.\n\n## السياق\n${P.brief}\n\n## المتطلبات\n${P.requirements.map(s=>'- '+s).join('\n')}\n\n## الافتراضات\n${P.assumptions.map(s=>'- '+s).join('\n')||'لا توجد افتراضات إضافية'}\n\n## المخرجات\n${(P.deliverables||['العمل المختار وخطة تنفيذه']).map(s=>'- '+s).join('\n')}\n\n## المراحل\n${phases.filter(p=>Q.some(q=>phaseOf(q).id===p.id)).map(p=>'- '+p.title+': '+p.description).join('\n')}\n\n## القرارات الفعالة في المسار الحالي\n${decisions}\n\n## عناصر العمل والتبعيات ومعايير القبول\n${tasks||'اشتق خطوات التنفيذ من القرارات أعلاه.'}\n\n## ملاحظات عامة وأسئلة غير محسومة\n${state.general||'لا توجد'}\n\n## ملاحظات مرجعية خارج الاعتماد\n${otherNotes.join('\n')||'لا توجد'}\n\n## المقاسات وطريقة العرض\n${P.responsive}\n${views.map(v=>v.title+': '+v.width+'×'+v.height).join('، ')}\n\n## مصدر المشروع\n${P.source?JSON.stringify(P.source,null,2):'لم يحدد'}\n\n## الصفحات والتنقل\n${pageExport()}\n\n## الهوية\n${P.visualStyle||'إطار مختبر الدارك: #0a0a0a و#f1f0ec وخط IBM Plex Sans Arabic؛ هوية العمل داخل المعاينة مستقلة.'}\n\n## معايير التنفيذ\n- اكتمال المخرجات ومهامها وتبعياتها، وفق الاختيارات الفعالة فقط.\n- الأفكار تختلف في البنية والسلوك؛ حافظ على ذلك عند التنفيذ.\n- الحركة المختارة تطابق المعاينة وتدعم تقليل الحركة.\n- وضوح النصوص ولوحة المفاتيح والتجاوب حيث ينطبق.\n- لا تعتبر المعاينة خدمة خلفية أو ملف فيديو أو نتيجة بحث مثبتة.\n\n## بيانات الاختيارات\n\`\`\`json\n${JSON.stringify(selection(),null,2)}\n\`\`\`\n\n## لوحة العمل والمشاهد المختارة HTML/CSS\nالخط مضمّن في تنزيل HTML؛ بياناته الثنائية محذوفة من هذا النص لسهولة نسخه.\n\`\`\`html\n${fullDocument(false)}\n\`\`\``}
function showResult(){state.done=true;$('copy').textContent='نسخ النص ⧉';$('output').textContent=exportText();$('work').hidden=true;$('result').hidden=false;save();$('copy').focus();window.scrollTo({top:0,behavior:'auto'})}function edit(){state.done=false;$('work').hidden=false;$('result').hidden=true;renderQuestion(true);fit();save()}
let toastTimer;function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('copy').addEventListener('click',async()=>{const value=$('output').textContent;try{if(!navigator.clipboard?.writeText)throw Error('unavailable');await navigator.clipboard.writeText(value);toast('تم نسخ النص كاملًا');$('copy').textContent='تم النسخ ✓'}catch{const a=document.createElement('textarea');a.value=value;a.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch{}a.remove();if(ok){toast('تم نسخ النص كاملًا');$('copy').textContent='تم النسخ ✓'}else{const range=document.createRange();range.selectNodeContents($('output'));const s=getSelection();s.removeAllRanges();s.addRange(range);$('output').focus();toast('تم تحديد النص؛ استخدم نسخ من جهازك أو نزّل النص')}}});
$('edit').addEventListener('click',edit);$('json-download').addEventListener('click',()=>download(P.id+'-choices.json',JSON.stringify(selection(),null,2),'application/json'));$('site-download').addEventListener('click',()=>download(P.id+'-board.html',fullDocument(),'text/html'));$('text-download').addEventListener('click',()=>download(P.id+'-brief.md',exportText(),'text/markdown'));
$('next').addEventListener('click',()=>state.step<Q.length?go(state.step+1):showResult());$('prev').addEventListener('click',()=>go(state.step-1));$('dots').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(Number(b.dataset.i))});$('phase-select').addEventListener('change',e=>go(e.target.value==='review'?Q.length:Q.findIndex(q=>phaseOf(q).id===e.target.value)));$('question').addEventListener('click',e=>{const b=e.target.closest('.opt');if(b)choose(b.dataset.v,true)});
$('question').addEventListener('keydown',e=>{const b=e.target.closest('.opt');if(!b||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const q=Q[state.step],i=q.options.findIndex(o=>o.id===b.dataset.v),n=q.options.length;choose(q.options[e.key==='Home'?0:e.key==='End'?n-1:(i+(['ArrowDown','ArrowLeft'].includes(e.key)?1:-1)+n)%n].id,true)});
$('formats').innerHTML=views.map(v=>`<button type="button" data-mode="${v.id}" aria-pressed="${v.id===state.device}">${esc(v.title)}</button>`).join('');$('formats').addEventListener('click',e=>{const b=e.target.closest('button');if(b){state.device=b.dataset.mode;fit();renderQuestion();if($('flow-dialog').open)renderFlow();if($('page-dialog').open)renderPageDetail();save()}});$('screen').addEventListener('change',e=>{state.screen=e.target.value;renderPreview();save()});
for(const [id,frame] of [['component-replay','component-frame'],['site-replay','site-frame']])$(id).addEventListener('click',()=>{$(frame).contentWindow.postMessage({type:'mokhtabar:play'},'*');toast('تشغيل')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.done){e.preventDefault();edit();return}if(e.target.closest('dialog')||e.key!=='Enter'||e.isComposing||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest('textarea,input,select,button,[contenteditable="true"]')||state.done)return;e.preventDefault();state.step<Q.length?go(state.step+1):showResult()});
let graphSelected=P.flow?.entry||P.screens[0].id,pageDetailId=graphSelected,graphDragged=false;
function pageChoices(id){return Q.filter(q=>selected(q).patches[id]||['palette','typography'].includes(q.kind))}
function pageExport(){return visibleScreens().map(s=>`- ${s.id}: ${s.title} (${s.route||'—'})\n  الغرض: ${s.purpose||s.title}\n  الأقسام: ${(s.sections||[]).join('، ')}\n  الإجراءات: ${(s.actions||[]).join('، ')}\n  الاختيارات: ${pageChoices(s.id).map(q=>q.title+' '+selected(q).title).join('؛ ')}\n  ملاحظة الصفحة: ${state.pageNotes[s.id]||'لا توجد'}`).join('\n')+'\n\nالانتقالات:\n'+activeEdges().map(e=>`- ${e.from} → ${e.to}: ${e.trigger}`).join('\n')}
function nodeMetrics(){const view=views.find(v=>v.id===state.device)||views[0],portrait=view.height>view.width,previewWidth=portrait?156:226,previewHeight=previewWidth*view.height/view.width;return {view,width:previewWidth+24,height:previewHeight+74,previewWidth,previewHeight}}
function defaultPositions(){const metrics=nodeMetrics();const screens=visibleScreens(),edges=activeEdges(),level=new Map(),entry=P.flow?.entry||screens[0]?.id;if(entry)level.set(entry,0);const queue=[entry];while(queue.length){const id=queue.shift();for(const edge of edges.filter(e=>e.from===id)){if(!level.has(edge.to)){level.set(edge.to,(level.get(id)||0)+1);queue.push(edge.to)}}}const counts=new Map();return Object.fromEntries(screens.map(s=>{const l=level.get(s.id)??(s.id===entry?0:1),i=counts.get(l)||0;counts.set(l,i+1);return [s.id,state.canvasPositions[s.id]||s.position||{x:70+l*(metrics.width+110),y:70+i*(metrics.height+50)}]}))}
let graphPositions={};
function graphTransform(){const v=state.canvasView;$('flow-world').style.transform=`translate(${v.x}px,${v.y}px) scale(${v.zoom})`;$('flow-zoom').textContent=Math.round(v.zoom*100)+'%'}
function edgePath(edge){const a=graphPositions[edge.from],b=graphPositions[edge.to];if(!a||!b)return null;const m=nodeMetrics(),mid=a.y+m.height/2;if(edge.from===edge.to)return {d:`M ${a.x+m.width} ${mid} C ${a.x+m.width+90} ${a.y-70}, ${a.x-90} ${a.y-70}, ${a.x} ${mid}`,x:a.x+m.width/2,y:a.y-12};if(Math.abs(a.x-b.x)<30){const x1=a.x+m.width,x2=b.x+m.width,y1=mid,y2=b.y+m.height/2,out=Math.max(x1,x2)+100;return {d:`M ${x1} ${y1} C ${out} ${y1}, ${out} ${y2}, ${x2} ${y2}`,x:out-10,y:(y1+y2)/2}}const forward=b.x>a.x,x1=forward?a.x+m.width:a.x,x2=forward?b.x:b.x+m.width,y1=a.y+m.height*(forward?.45:.68),y2=b.y+m.height*(forward?.45:.68),dx=Math.max(60,Math.abs(x2-x1)*.5),sign=forward?1:-1;return {d:`M ${x1} ${y1} C ${x1+sign*dx} ${y1}, ${x2-sign*dx} ${y2}, ${x2} ${y2}`,x:(x1+x2)/2,y:(y1+y2)/2-10}}
function renderEdges(){const edges=activeEdges();$('flow-edges').innerHTML='<defs><marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#b5b5b1"/></marker></defs>'+edges.map(e=>{const p=edgePath(e);return p?`<g data-edge="${e.id}"><path d="${p.d}" marker-end="url(#flow-arrow)"/><text x="${p.x}" y="${p.y}" text-anchor="middle">${esc(e.trigger)}</text></g>`:''}).join('')}
function renderFlow(){const screens=visibleScreens(),metrics=nodeMetrics();$('flow-format').value=state.device;if(!screens.some(s=>s.id===graphSelected))graphSelected=screens[0]?.id;graphPositions=defaultPositions();$('flow-nodes').innerHTML=screens.map(s=>{const pos=graphPositions[s.id];return `<button type="button" class="flow-node" data-page="${s.id}" aria-pressed="${s.id===graphSelected}" style="left:${pos.x}px;top:${pos.y}px;width:${metrics.width}px;height:${metrics.height}px"><span class="node-title">${esc(s.title)}${s.id===P.flow?.entry?'<small>البداية</small>':''}</span><span class="node-preview" style="width:${metrics.previewWidth}px;height:${metrics.previewHeight}px"><iframe sandbox tabindex="-1" aria-hidden="true" title="${esc(s.title)}" data-thumb-page="${s.id}"></iframe></span><small class="node-route">${esc(s.route||'')}</small></button>`}).join('');const view=views.find(v=>v.id===state.device)||views[0];for(const frame of $('flow-nodes').querySelectorAll('iframe')){frame.style.width=view.width+'px';frame.style.height=view.height+'px';frame.style.transform=`scale(${metrics.previewWidth/view.width})`;frame.srcdoc=wrap(screenHTML(frame.dataset.thumbPage),siteCSS(),P.screens.find(s=>s.id===frame.dataset.thumbPage).title,true,false)}renderEdges();graphTransform();renderGraphDetails()}
function pageSpecs(s){return `<p class="route">${esc(s.route||'')}</p>${s.purpose?`<p>${esc(s.purpose)}</p>`:''}${s.sections?.length?'<h4>الأقسام</h4><ul>'+s.sections.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}${s.actions?.length?'<h4>الإجراءات</h4><ul>'+s.actions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}${pageChoices(s.id).length?'<details class="decision-details"><summary>اختيارات الصفحة</summary>'+pageChoices(s.id).map(q=>'<p>'+esc(q.title)+' '+esc(selected(q).title)+'</p>').join('')+'</details>':''}${P.source?.fidelity==='reconstructed'?'<small>معاينة معاد بناؤها من المرجع.</small>':''}`}
function renderGraphDetails(){const s=P.screens.find(s=>s.id===graphSelected);if(!s)return;$('flow-details').innerHTML=`<h3>${esc(s.title)}</h3>${pageSpecs(s)}<button type="button" id="flow-open-page" class="btn">فتح الصفحة</button><label for="flow-page-note">ملاحظة للوكيل</label><textarea id="flow-page-note" placeholder="ملاحظتك على الصفحة">${esc(state.pageNotes[s.id]||'')}</textarea>`;$('flow-page-note').addEventListener('input',e=>{state.pageNotes[s.id]=e.target.value;state.done=false;save()});$('flow-open-page').addEventListener('click',()=>openPage(s.id))}
function selectGraph(id){graphSelected=id;for(const node of $('flow-nodes').querySelectorAll('button'))node.setAttribute('aria-pressed',node.dataset.page===id);renderGraphDetails()}
function renderPageDetail(){const s=P.screens.find(s=>s.id===pageDetailId);if(!s)return;$('page-heading').textContent=s.title;$('page-specs').innerHTML=pageSpecs(s);$('page-note').value=state.pageNotes[s.id]||'';const view=views.find(v=>v.id===state.device)||views[0];$('page-format').value=state.device;$('page-size').innerHTML=esc(view.title)+' · <span class="dimensions">'+view.width+' × '+view.height+'</span>';$('page-live-frame').srcdoc=wrap(screenHTML(s.id),siteCSS(),s.title);fitPageDetail()}
function fitPageDetail(){const view=views.find(v=>v.id===state.device)||views[0],box=$('page-preview'),frame=$('page-live-frame'),scale=Math.min(Math.max(1,box.clientWidth-24)/view.width,Math.max(1,box.clientHeight-24)/view.height);frame.style.width=view.width+'px';frame.style.height=view.height+'px';frame.style.transform=`translateX(-50%) scale(${scale})`}
function openPage(id){if(!visibleScreens().some(s=>s.id===id))return;pageDetailId=id;if(!$('page-dialog').open)$('page-dialog').showModal();renderPageDetail()}
$('page-note').addEventListener('input',e=>{state.pageNotes[pageDetailId]=e.target.value;state.done=false;save()});$('page-use').addEventListener('click',()=>{state.screen=pageDetailId;$('page-dialog').close();if($('flow-dialog').open)$('flow-dialog').close();renderPreview();save()});$('page-replay').addEventListener('click',()=>$('page-live-frame').contentWindow.postMessage({type:'mokhtabar:play'},'*'));$('page-format').innerHTML=views.map(v=>`<option value="${v.id}">${esc(v.title)}</option>`).join('');$('page-format').addEventListener('change',e=>{state.device=e.target.value;renderPageDetail();fit();renderQuestion();save()});new ResizeObserver(fitPageDetail).observe($('page-preview'));
$('flow-format').innerHTML=views.map(v=>`<option value="${v.id}">${esc(v.title)}</option>`).join('');$('flow-format').addEventListener('change',e=>{state.device=e.target.value;renderFlow();$('flow-fit').click();renderQuestion();fit();save()});
$('flow-open').addEventListener('click',()=>{graphSelected=state.screen;$('flow-dialog').showModal();renderFlow()});$('page-open').addEventListener('click',()=>openPage(state.screen));document.querySelectorAll('[data-close-dialog]').forEach(b=>b.addEventListener('click',()=>$(b.dataset.closeDialog).close()));
function graphZoom(factor,cx,cy){const area=$('flow-area').getBoundingClientRect(),v=state.canvasView,x=cx??area.width/2,y=cy??area.height/2,next=Math.max(.15,Math.min(2,v.zoom*factor));v.x=x-(x-v.x)*next/v.zoom;v.y=y-(y-v.y)*next/v.zoom;v.zoom=next;graphTransform();save()}
$('flow-in').addEventListener('click',()=>graphZoom(1.2));$('flow-out').addEventListener('click',()=>graphZoom(1/1.2));$('flow-fit').addEventListener('click',()=>{const pos=Object.values(graphPositions),metrics=nodeMetrics();if(!pos.length)return;const minX=Math.min(...pos.map(p=>p.x)),minY=Math.min(...pos.map(p=>p.y)),maxX=Math.max(...pos.map(p=>p.x+metrics.width)),maxY=Math.max(...pos.map(p=>p.y+metrics.height)),box=$('flow-area'),z=Math.max(.15,Math.min(1.2,(box.clientWidth-64)/(maxX-minX),(box.clientHeight-64)/(maxY-minY)));state.canvasView={x:32-minX*z,y:32-minY*z,zoom:z};graphTransform();save()});$('flow-area').addEventListener('wheel',e=>{e.preventDefault();const r=$('flow-area').getBoundingClientRect();graphZoom(e.deltaY<0?1.08:1/1.08,e.clientX-r.left,e.clientY-r.top)},{passive:false});
let drag=null;$('flow-area').addEventListener('pointerdown',e=>{if(e.button!==0)return;const node=e.target.closest('.flow-node');graphDragged=false;drag={pointer:e.pointerId,startX:e.clientX,startY:e.clientY,node:node?.dataset.page,x:node?graphPositions[node.dataset.page].x:state.canvasView.x,y:node?graphPositions[node.dataset.page].y:state.canvasView.y};$('flow-area').setPointerCapture(e.pointerId)});$('flow-area').addEventListener('pointermove',e=>{if(!drag||drag.pointer!==e.pointerId)return;const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;if(Math.abs(dx)+Math.abs(dy)<4&&!graphDragged)return;graphDragged=true;if(drag.node){const z=state.canvasView.zoom,pos={x:Math.max(0,Math.min(20000,drag.x+dx/z)),y:Math.max(0,Math.min(20000,drag.y+dy/z))};graphPositions[drag.node]=pos;state.canvasPositions[drag.node]=pos;const node=$('flow-nodes').querySelector(`[data-page="${drag.node}"]`);node.style.left=pos.x+'px';node.style.top=pos.y+'px';renderEdges()}else{state.canvasView.x=drag.x+dx;state.canvasView.y=drag.y+dy;graphTransform()}});function endDrag(){if(drag){if(drag.node&&!graphDragged)selectGraph(drag.node);drag=null;save()}}$('flow-area').addEventListener('pointerup',endDrag);$('flow-area').addEventListener('pointercancel',endDrag);$('flow-nodes').addEventListener('click',e=>{const node=e.target.closest('.flow-node');if(node&&!graphDragged)selectGraph(node.dataset.page);graphDragged=false});$('flow-nodes').addEventListener('dblclick',e=>{const node=e.target.closest('.flow-node');if(node)openPage(node.dataset.page)});$('flow-nodes').addEventListener('keydown',e=>{const node=e.target.closest('.flow-node');if(!node)return;if(e.key==='Enter'){e.preventDefault();selectGraph(node.dataset.page)}else if(e.key===' '){e.preventDefault();openPage(node.dataset.page)}});
window.addEventListener('message',e=>{if(e.data?.type!=='mokhtabar:navigate')return;const from=e.source===$('site-frame').contentWindow?state.screen:e.source===$('page-live-frame').contentWindow&&$('page-dialog').open?pageDetailId:null;if(!from||typeof e.data.target!=='string'||!activeEdges().some(edge=>edge.from===from&&edge.to===e.data.target))return;if(e.source===$('page-live-frame').contentWindow){pageDetailId=e.data.target;$('page-format').value=state.device;renderPageDetail()}else{state.screen=e.data.target;renderPreview();save()}});

$('project-title').textContent=P.title;document.title='مختبر / '+P.title;$('screen').innerHTML=visibleScreens().map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('');applySelection(P.initialSelection);restore();refresh();if(state.step<Q.length)state.screen=Q[state.step].screen;renderQuestion();renderPreview();new ResizeObserver(()=>{fit();fitChoiceThumbs()}).observe($('viewport'));if(state.done)showResult();else if(storageOK)save();
})();
</script>
